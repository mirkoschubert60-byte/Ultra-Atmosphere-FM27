name: Worldwide FM27 Tifo Batch Research
on:
  workflow_dispatch:
    inputs:
      offset:
        description: 'Start index within seed_40.json (0-39)'
        required: true
        default: '0'
      count:
        description: 'Number of clubs (1-10)'
        required: true
        default: '5'
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Research real FM27 club IDs
        env:
          OFFSET: ${{ inputs.offset }}
          COUNT: ${{ inputs.count }}
        run: python tools/batch_research.py --offset "$OFFSET" --count "$COUNT"
      - uses: actions/upload-artifact@v4
        with:
          name: fm27-tifo-batch-${{ inputs.offset }}
          path: |
            output/batch_candidates.json
            output/batch_summary.csv
          retention-days: 7

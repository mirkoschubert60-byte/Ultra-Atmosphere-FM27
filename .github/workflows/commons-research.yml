name: Wikimedia Commons Tifo Research
on:
  workflow_dispatch:
    inputs:
      club:
        description: 'Club name to research'
        required: true
        default: 'Eintracht Frankfurt'
      club_id:
        description: 'FM27 club ID (if known)'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Search Commons and save candidates
        env:
          CLUB: ${{ inputs.club }}
          CLUB_ID: ${{ inputs.club_id }}
        run: python tools/commons_tifo.py --club "$CLUB" --club-id "$CLUB_ID"
      - name: Filter club-specific choreography candidates
        run: python tools/triage_candidates.py
      - name: Download real photo previews for review
        run: python tools/download_previews.py
      - uses: actions/upload-artifact@v4
        with:
          name: tifo-research-candidates
          path: |
            output/candidates.*
            output/triage.*
            output/preview_manifest.json
            output/previews/*.jpg
          retention-days: 7

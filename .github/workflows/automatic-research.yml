name: Automatic FM27 Worldwide Image Research
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: automatic-fm27-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Research next clubs and save progress
        run: python tools/auto_research.py --count 3
      - name: Commit progress and source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Data/research_batches/
          if ! git diff --cached --quiet; then
            git commit -m "Research next FM27 clubs automatically [skip ci]"
            git push
          else
            echo "No new research; all seed clubs completed."
          fi
